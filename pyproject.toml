[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
# Dependency pins live in requirements.txt; APP_VERSION supplies the runtime version.
name = "ghostfolio-degiro-sync"
version = "0.0.0"
requires-python = ">=3.14"

[tool.setuptools]
packages = ["ghostfolio_degiro_sync"]
py-modules = ["ghostfolio_core", "degiro_to_ghostfolio"]

[tool.setuptools.package-data]
ghostfolio_degiro_sync = ["cash-rules.yaml"]

[tool.ruff]
target-version = "py314"
include = ["ghostfolio_degiro_sync/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["ghostfolio_degiro_sync"]
