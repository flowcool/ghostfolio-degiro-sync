version: 2
updates:
  # Renovate owns version and security-update PRs. Keep the dependency graph
  # and Dependabot alerts enabled. Zero disables version PRs only; the separate
  # GitHub automatic-security-update setting must also be disabled after the
  # Renovate handover checks in docs/upstreams.md have passed.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
