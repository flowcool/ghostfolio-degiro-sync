name: Core integrity

on:
  # PRs and the weekly schedule cover main; no re-run on every branch push.
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: core-integrity-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, inherited IBKR pin
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, inherited IBKR pin
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify source hashes, projection closure and upstream main changes
        run: python scripts/check_core.py --check-main
      - name: Offline core and guard regressions
        run: python -m pytest -q
