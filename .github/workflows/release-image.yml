name: Publish release image

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-image
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - id: release
        run: python scripts/release_image.py --registry-login
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pytest -q
      - run: pip-audit
      - run: python scripts/check_core.py

  native-image:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build native runtime for validation
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: degiro-release:check
          build-args: APP_VERSION=${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
      - name: Gate fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: degiro-release:check
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-files: /usr/local/bin/supercronic
          trivyignores: .trivyignore.yaml
      - name: Advisory scan including scheduler
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: degiro-release:check
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - run: python scripts/smoke_container.py degiro-release:check
      - name: Synthetic complete community journey before publication
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            --mount type=bind,src="$PWD/scripts/community_journey.py",dst=/journey/community_journey.py,readonly \
            --mount type=bind,src="$PWD/tests/fixtures/degiro_contract.yaml",dst=/journey/degiro_contract.yaml,readonly \
            degiro-release:check python /journey/community_journey.py
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish checked native image by digest, with SBOM and provenance
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          build-args: APP_VERSION=${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
      - name: Verify publication uses the validated image configuration
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          python scripts/verify_release_image.py --image "$IMAGE" --digest "$IMAGE_DIGEST" --arch "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*.txt
          if-no-files-found: error

  manifest:
    needs: [preflight, native-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Recheck single-publication version guard
        run: python scripts/release_image.py --registry
      - name: Assemble version manifest and verify both architectures
        run: |
          python - <<'PY'
          import json, os, re, subprocess, sys
          sys.path.insert(0, "scripts")
          from verify_release_image import native_manifest_digest
          from pathlib import Path
          image, tag = os.environ['IMAGE'], os.environ['RELEASE_TAG']
          digests = [Path('digests', arch + '.txt').read_text() for arch in ('amd64', 'arm64')]
          assert all(re.fullmatch(r'sha256:[0-9a-f]{64}', digest) for digest in digests)
          subprocess.run(['docker', 'buildx', 'imagetools', 'create', '--tag', image + ':' + tag,
                          *[image + '@' + digest for digest in digests]], check=True)
          raw = subprocess.check_output(['docker', 'buildx', 'imagetools', 'inspect', '--raw', image + ':' + tag])
          manifest = json.loads(raw)
          platforms = {(entry['platform']['os'], entry['platform']['architecture']) for entry in manifest['manifests']}
          assert {('linux', 'amd64'), ('linux', 'arm64')} <= platforms
          for arch, digest in zip(('amd64', 'arm64'), digests, strict=True):
              checked = json.loads(subprocess.check_output([
                  'docker', 'buildx', 'imagetools', 'inspect', '--raw', image + '@' + digest]))
              assert native_manifest_digest(manifest, arch) == native_manifest_digest(checked, arch)
          Path('release-manifest.json').write_bytes(raw)
          PY
      - name: Promote only the current stable release to latest
        if: needs.preflight.outputs.prerelease == 'false'
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$current" = "$RELEASE_TAG" ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$RELEASE_TAG"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error
